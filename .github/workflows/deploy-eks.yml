name: Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      mode:
        description: "OpenBao mode"
        required: true
        default: ha
        type: choice
        options:
          - standalone
          - ha
      community_plugins:
        description: "Install community plugins"
        required: true
        default: true
        type: boolean
      init_unseal:
        description: "Initialize and unseal after deploy"
        required: true
        default: false
        type: boolean

  push:
    branches: [main]
    paths:
      - "helm/**"
      - "scripts/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - run: git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" .

      - name: Install tools
        run: |
          aws --version
          curl -sL https://get.helm.sh/helm-v3.17.2-linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin linux-amd64/helm
          helm version
          curl -sL https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl \
            -o /usr/local/bin/kubectl
          chmod 755 /usr/local/bin/kubectl
          kubectl version --client

      - name: Authenticate to AWS via OIDC and deploy
        run: |
          chmod +x scripts/eks-oidc-auth.sh
          ./scripts/eks-oidc-auth.sh \
            --role-arn "${{ secrets.OIDC_ROLE_ARN }}" \
            --cluster "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --namespace "openbao-${{ github.event.inputs.environment || 'dev' }}" \
            --install

      - name: Initialize and unseal
        if: ${{ github.event.inputs.init_unseal == 'true' }}
        run: |
          ./scripts/init-and-unseal.sh \
            --namespace "openbao-${{ github.event.inputs.environment || 'dev' }}" \
            --release openbao

      - name: Verify deployment
        run: |
          kubectl get pods -n "openbao-${{ github.event.inputs.environment || 'dev' }}" \
            -l app.kubernetes.io/name=openbao
