name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  pull_request:
    branches: [main]

env:
  HELM_VERSION: v3.17.2
  TERRAFORM_VERSION: 1.11.4

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" .
      - run: curl -sL https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz | tar xz --strip-components=1 -C /usr/local/bin linux-amd64/helm
      - run: helm lint helm/openbao/
      - run: |
          helm template ci-test helm/openbao/ --namespace ci --kube-version 1.28.0 --set server.standalone.enabled=true
          helm template ci-test helm/openbao/ --namespace ci --kube-version 1.28.0 --set server.ha.enabled=true --set server.standalone.enabled=false

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" .
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck scripts/*.sh

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" .
      - run: |
          curl -sL https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip -o /tmp/tf.zip
          sudo unzip -q -o /tmp/tf.zip -d /usr/local/bin && rm /tmp/tf.zip
      - run: terraform fmt -check -recursive || true
        working-directory: terraform
      - run: terraform init -backend=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform

  helm-plugin-test:
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" .
      - run: curl -sL https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz | tar xz --strip-components=1 -C /usr/local/bin linux-amd64/helm
      - run: |
          helm template ci-test helm/openbao/ --namespace ci --kube-version 1.28.0 \
            --set server.ha.enabled=true --set server.standalone.enabled=false \
            --set plugins.community.enabled=true \
            --set plugins.community.auth.aws.enabled=true \
            --set plugins.community.auth.azure.enabled=true \
            --set plugins.community.auth.gcp.enabled=true \
            --set plugins.community.auth.github.enabled=true \
            --set plugins.community.secrets.aws.enabled=true \
            --set plugins.community.secrets.azure.enabled=true \
            --set plugins.community.secrets.gcp.enabled=true \
            --set plugins.community.secrets.gcpkms.enabled=true \
            --set plugins.community.secrets.nomad.enabled=true \
            --set plugins.community.secrets.consul.enabled=true \
            --set monitoring.serviceMonitor.enabled=true \
            --set injector.enabled=true \
            | grep -q "download_plugin" && echo "Plugin init container OK"
