apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: example-app
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: example-app-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: example-app
        property: password
