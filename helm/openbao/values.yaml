global:
  enabled: true
  namespace: ""
  tlsDisable: true
  openshift: false

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podDisruptionBudget:
  enabled: false
  maxUnavailable: ""
  minAvailable: 1

networkPolicy:
  enabled: false
  egress: []
  ingress: []

server:
  enabled: "-"

  # Extra initContainers to run before/with default init logic
  extraInitContainers: []
  # Extra sidecars alongside the main container
  extraContainers: []
  # Share process namespace
  shareProcessNamespace: false

  image:
    registry: quay.io
    repository: openbao/openbao
    tag: ""
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  updateStrategyType: OnDelete
  podManagementPolicy: OrderedReady
  terminationGracePeriodSeconds: 30
  hostNetwork: false
  dnsConfig: {}

  annotations: {}

  configPath: /openbao/config

  logLevel: info
  logFormat: standard

  apiAddr: ""
  clusterAddr: ""

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  livenessProbe:
    httpGet:
      path: /v1/sys/health?standbyok=true
      port: 8200
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /v1/sys/health?standbyok=true
      port: 8200
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /v1/sys/health?standbyok=true
      port: 8200
      scheme: HTTP
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12

  extraArgs: ""
  extraEnvironmentVars: []
  extraEnvSecrets: []
  extraVolumeMounts: []

  openbaoUID: 100

  preStopSleepSeconds: 5

  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000

  affinity: {}

  topologySpreadConstraints: []

  dev:
    enabled: false
    devRootToken: root

  standalone:
    enabled: true
    tls:
      enabled: false
      certFile: /openbao/tls/tls.crt
      keyFile: /openbao/tls/tls.key
      clientCaFile: ""
      requireClientCert: false
    config: |
      ui = true

      listener "tcp" {
        {{- if .Values.server.standalone.tls.enabled }}
        tls_disable = 0
        tls_cert_file = "{{ .Values.server.standalone.tls.certFile }}"
        tls_key_file  = "{{ .Values.server.standalone.tls.keyFile }}"
        {{- if .Values.server.standalone.tls.clientCaFile }}
        tls_client_ca_file = "{{ .Values.server.standalone.tls.clientCaFile }}"
        tls_require_and_verify_client_cert = {{ .Values.server.standalone.tls.requireClientCert | default false }}
        {{- end }}
        {{- else }}
        tls_disable = 1
        {{- end }}
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/openbao/data"
      }

      service_registration "kubernetes" {}

      {{- if .Values.seal.awskms.enabled }}
      seal "awskms" {
        region     = "{{ .Values.seal.awskms.region }}"
        kms_key_id = "{{ .Values.seal.awskms.kms_key_id }}"
        {{- if .Values.seal.awskms.endpoint }}
        endpoint   = "{{ .Values.seal.awskms.endpoint }}"
        {{- end }}
      }
      {{- end }}
      {{- if .Values.seal.azurekv.enabled }}
      seal "azurekeyvault" {
        tenant_id  = "{{ .Values.seal.azurekv.tenant_id }}"
        vault_name = "{{ .Values.seal.azurekv.vault_name }}"
        key_name   = "{{ .Values.seal.azurekv.key_name }}"
        resource   = "{{ .Values.seal.azurekv.resource }}"
      }
      {{- end }}
      {{- if .Values.seal.gcpkms.enabled }}
      seal "gcpckms" {
        credentials = "{{ .Values.seal.gcpkms.credentials }}"
        project     = "{{ .Values.seal.gcpkms.project }}"
        region      = "{{ .Values.seal.gcpkms.region }}"
        key_ring    = "{{ .Values.seal.gcpkms.key_ring }}"
        crypto_key  = "{{ .Values.seal.gcpkms.crypto_key }}"
      }
      {{- end }}
      {{- if .Values.seal.transit.enabled }}
      seal "transit" {
        address     = "{{ .Values.seal.transit.address }}"
        token       = "{{ .Values.seal.transit.token }}"
        key_name    = "{{ .Values.seal.transit.key_name }}"
        mount_path  = "{{ .Values.seal.transit.mount_path }}"
        {{- if .Values.seal.transit.namespace }}
        namespace   = "{{ .Values.seal.transit.namespace }}"
        {{- end }}
      }
      {{- end }}
      {{- if .Values.seal.pkcs11.enabled }}
      seal "pkcs11" {
        lib       = "{{ .Values.seal.pkcs11.lib }}"
        slot      = "{{ .Values.seal.pkcs11.slot }}"
        pin       = "{{ .Values.seal.pkcs11.pin }}"
        key_label = "{{ .Values.seal.pkcs11.key_label }}"
        {{- if .Values.seal.pkcs11.hmac_key_label }}
        hmac_key_label = "{{ .Values.seal.pkcs11.hmac_key_label }}"
        {{- end }}
      }
      {{- end }}

  ha:
    enabled: false
    replicas: 3
    antiAffinity: true

    tls:
      enabled: false
      certFile: /openbao/tls/tls.crt
      keyFile: /openbao/tls/tls.key
      clientCaFile: ""
      requireClientCert: false
    raft:
      enabled: true
      setNodeId: true
      snapshotThreshold: 8192
      snapshotInterval: "30s"
      config: |
        ui = true

        listener "tcp" {
          {{- if and .Values.server.ha.tls .Values.server.ha.tls.enabled }}
          tls_disable = 0
          tls_cert_file = "{{ .Values.server.ha.tls.certFile }}"
          tls_key_file  = "{{ .Values.server.ha.tls.keyFile }}"
          {{- if .Values.server.ha.tls.clientCaFile }}
          tls_client_ca_file = "{{ .Values.server.ha.tls.clientCaFile }}"
          tls_require_and_verify_client_cert = {{ .Values.server.ha.tls.requireClientCert | default false }}
          {{- end }}
          {{- else }}
          tls_disable     = 1
          {{- end }}
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"
          node_id = "NODE_ID_PLACEHOLDER"
          snapshot_threshold = {{ .Values.server.ha.raft.snapshotThreshold }}
          snapshot_interval = "{{ .Values.server.ha.raft.snapshotInterval }}"
          {{- range $i := until (int .Values.server.ha.replicas) }}
          retry_join {
            leader_api_addr = "http{{ if and $.Values.server.ha.tls $.Values.server.ha.tls.enabled }}s{{ end }}://{{ $.Release.Name }}-{{ $i }}.{{ $.Release.Name }}-internal:8200"
          }
          {{- end }}
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time      = "24h"
          unauthenticated_metrics_access = true
        }

        plugin_directory = "/vault/plugins"

        {{- if .Values.seal.awskms.enabled }}
        seal "awskms" {
          region     = "{{ .Values.seal.awskms.region }}"
          kms_key_id = "{{ .Values.seal.awskms.kms_key_id }}"
          {{- if .Values.seal.awskms.endpoint }}
          endpoint   = "{{ .Values.seal.awskms.endpoint }}"
          {{- end }}
        }
        {{- end }}
        {{- if .Values.seal.azurekv.enabled }}
        seal "azurekeyvault" {
          tenant_id  = "{{ .Values.seal.azurekv.tenant_id }}"
          vault_name = "{{ .Values.seal.azurekv.vault_name }}"
          key_name   = "{{ .Values.seal.azurekv.key_name }}"
          resource   = "{{ .Values.seal.azurekv.resource }}"
        }
        {{- end }}
        {{- if .Values.seal.gcpkms.enabled }}
        seal "gcpckms" {
          credentials = "{{ .Values.seal.gcpkms.credentials }}"
          project     = "{{ .Values.seal.gcpkms.project }}"
          region      = "{{ .Values.seal.gcpkms.region }}"
          key_ring    = "{{ .Values.seal.gcpkms.key_ring }}"
          crypto_key  = "{{ .Values.seal.gcpkms.crypto_key }}"
        }
        {{- end }}
        {{- if .Values.seal.transit.enabled }}
        seal "transit" {
          address     = "{{ .Values.seal.transit.address }}"
          token       = "{{ .Values.seal.transit.token }}"
          key_name    = "{{ .Values.seal.transit.key_name }}"
          mount_path  = "{{ .Values.seal.transit.mount_path }}"
          {{- if .Values.seal.transit.namespace }}
          namespace   = "{{ .Values.seal.transit.namespace }}"
          {{- end }}
        }
        {{- end }}
        {{- if .Values.seal.pkcs11.enabled }}
        seal "pkcs11" {
          lib       = "{{ .Values.seal.pkcs11.lib }}"
          slot      = "{{ .Values.seal.pkcs11.slot }}"
          pin       = "{{ .Values.seal.pkcs11.pin }}"
          key_label = "{{ .Values.seal.pkcs11.key_label }}"
          {{- if .Values.seal.pkcs11.hmac_key_label }}
          hmac_key_label = "{{ .Values.seal.pkcs11.hmac_key_label }}"
          {{- end }}
        }
        {{- end }}

        audit "file" "file_log" {
          description = "File-based audit log for OpenBao"

          options = {
            file_path = "/vault/logs/audit.log"
            log_raw   = "false"
          }
        }

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  auditStorage:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  service:
    enabled: true
    type: ClusterIP
    port: 8200
    clusterPort: 8201
    clusterIP: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    annotations: {}

  ingress:
    enabled: false
    # For internet-facing deployments, use ingressClassName: alb (AWS) or nginx
    # For corporate/internal deployments, switch to internal ALB or internal NGINX:
    #   ingressClassName: nginx
    #   annotations:
    #     alb.ingress.kubernetes.io/scheme: internal        # AWS internal ALB
    #     alb.ingress.kubernetes.io/target-type: ip
    ingressClassName: ""
    annotations: {}
    activeService: true
    hosts:
      - host: bao.example.com
        paths:
          - "/*"
    tls: []

monitoring:
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    relabelings: []
    path: /v1/sys/metrics
    params:
      format: ["prometheus"]
  prometheusRule:
    enabled: false
    namespace: ""
    labels: {}
    rules: []

ui:
  enabled: true
  service:
    enabled: true
    type: ClusterIP
    port: 8200
    annotations: {}

injector:
  enabled: false
  image:
    registry: quay.io
    repository: openbao/openbao
    tag: ""
    pullPolicy: IfNotPresent
  resources: {}
  replicaCount: 1
  leaderElect: true
  logLevel: info
  logFormat: standard
  metrics:
    enabled: false
    port: 8080
  service:
    enabled: true
    type: ClusterIP
    port: 443
    annotations: {}
  webhook:
    failurePolicy: Ignore
    timeoutSeconds: 30
    path: "/mutate"
  agentImage:
    registry: quay.io
    repository: openbao/openbao
    tag: ""
  authPath: auth/kubernetes
  authRole: ""
  certs:
    secretName: ""
    caBundle: ""
  extraEnv: []
  extraArgs: ""

# OpenBao Agent (standalone sidecar/init)
agent:
  enabled: false
  image:
    registry: quay.io
    repository: openbao/openbao
    tag: ""
    pullPolicy: IfNotPresent
  logLevel: info
  logFormat: standard
  auth:
    method: kubernetes
    mountPath: auth/kubernetes
    role: openbao-agent
    tokenTtl: 3600
  config: |
    auto_auth {
      method "kubernetes" {
        mount_path = "{{ .Values.agent.auth.mountPath }}"
        config = {
          role = "{{ .Values.agent.auth.role }}"
        }
      }
      sink "file" {
        config = {
          path = "/home/agent/.token"
        }
      }
    }
    cache {
      use_auto_auth_token = true
    }
    listener "tcp" {
      address = "127.0.0.1:8100"
      tls_disable = true
    }
    template_config {
      static_secret_render_interval = "5m"
      exit_on_retry_failure = false
    }
    vault {
      address = "http://{{ include \"openbao.fullname\" . }}.{{ .Release.Namespace }}.svc.cluster.local:8200"
    }
  templates: []
  # - source: /etc/agent/templates/secret.tpl
  #   destination: /etc/secrets/secret.json
  #   perms: "0440"
  #   command: []
  extraEnv: []
  extraVolumeMounts: []
  resources: {}
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# Auth configuration
auth:
  kubernetes:
    enabled: true
    mountPath: auth/kubernetes
    role: openbao-k8s
    boundServiceAccountNames: ["*"]
    boundServiceAccountNamespaces: ["{{ .Release.Namespace }}"]
    tokenTtl: 3600
    tokenMaxTtl: 86400
    policies: ["default"]
    audience: ""
  oidc:
    enabled: false
    mountPath: oidc
    discoveryUrl: ""
    clientId: ""
    clientSecret: ""
    clientSecretSecretName: ""
    clientSecretSecretKey: "client-secret"
    defaultRole: "default"
    allowedRedirectUris:
      - "https://bao.example.com/ui/vault/auth/oidc/oidc/callback"
      - "http://localhost:8250/oidc/callback"
    boundAudiences: []
    oidcScopes: ["openid", "profile", "email", "groups"]
    groupsClaim: "groups"
    userClaim: "email"
    roleType: "oidc"
    providerConfig: {}
    roles: []
  jwt:
    enabled: false
    mountPath: jwt
    jwksUrl: ""
    jwtSupportedAlgs: ["RS256"]
    defaultRole: "default"
    boundAudiences: []
    userClaim: "sub"
    groupsClaim: "groups"
    tokenTtl: 3600
    roles: []

# Multi-tenancy / Namespaces (OpenBao namespaces)
namespaces:
  enabled: false
  # List of namespaces to create
  tenants: []
  # - name: tenant-a
  #   description: "Tenant A"
  #   policies: ["tenant-a-admin"]
  #   groups: []
  #   auth:
  #     oidc:
  #       roles: []
  # Create root policies for tenants
  createPolicies: true
  policyTemplates:
    admin: |
      path "*" { capabilities = ["create", "read", "update", "delete", "list", "sudo"] }
    readOnly: |
      path "*/data/*" { capabilities = ["read", "list"] }
      path "*/metadata/*" { capabilities = ["read", "list"] }
    developer: |
      path "{{ .Namespace }}/data/*" { capabilities = ["create", "read", "update", "delete", "list"] }
      path "{{ .Namespace }}/metadata/*" { capabilities = ["create", "read", "update", "delete", "list"] }

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior: {}

# Injector autoscaling
injector:
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Snapshot CronJob for automated backups
snapshot:
  cronjob:
    enabled: false
    schedule: "0 2 * * *"
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    image:
      repository: bitnami/kubectl
      tag: latest
      pullPolicy: IfNotPresent
    s3:
      enabled: false
      bucket: ""
      region: ""
      secretName: ""
    resources: {}
    retentionDays: 7

# TLS / cert-manager
tls:
  certManager:
    enabled: false
    issuerRef:
      name: ""
      kind: ClusterIssuer
    duration: 2160h
    renewBefore: 360h

# Gateway API
gateway:
  enabled: false
  gatewayClassName: ""
  name: ""
  listeners: []
  routes:
    http: []
  tls:
    enabled: false
    certificateRefs: []

# Audit log shipping
audit:
  shipper:
    enabled: false
    image:
      repository: timberio/vector
      tag: 0.39.0-debian
      pullPolicy: IfNotPresent
    config: |
      [sources.openbao_audit]
      type = "file"
      include = ["/vault/logs/audit.log"]
      read_from = "beginning"
      [sinks.console]
      type = "console"
      inputs = ["openbao_audit"]
      encoding.codec = "json"
    resources: {}
    extraVolumeMounts: []

# Grafana dashboard
grafana:
  dashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
    annotations: {}
    name: ""



plugins:
  extra: {}
  #   my-plugin: <base64-encoded-binary-or-path>

  community:
    enabled: false

    baseURL: "https://github.com/openbao/openbao-plugins/releases/download"
    arch: "linux_amd64_v1"

    auth:
      aws:
        enabled: false
        version: v0.1.1
        sha256: ""
      azure:
        enabled: false
        version: v0.23.0
        sha256: ""
      gcp:
        enabled: false
        version: v0.22.0
        sha256: ""
      github:
        enabled: false
        version: v0.0.1
        sha256: ""

    secrets:
      aws:
        enabled: false
        version: v0.2.0
        sha256: ""
      azure:
        enabled: false
        version: v0.23.0
        sha256: ""
      gcp:
        enabled: false
        version: v0.23.0
        sha256: ""
      gcpkms:
        enabled: false
        version: v0.21.0
        sha256: ""
      nomad:
        enabled: false
        version: v0.1.5
        sha256: ""
      consul:
        enabled: false
        version: v0.1.0
        sha256: ""

  image:
    enabled: false
    repository: ""
    tag: latest
    pullPolicy: IfNotPresent
    volumeMounts: []

  sidecar:
    enabled: false
    image:
      repository: ""
      tag: latest
      pullPolicy: IfNotPresent
    command: []
    extraEnv: []
    extraVolumeMounts: []
    resources: {}

seal:
  # AWS KMS for auto-unseal.
  awskms:
    enabled: false
    region: ""
    kms_key_id: ""
    endpoint: ""
    irsaRoleArn: ""

  # Azure Key Vault for auto-unseal
  azurekv:
    enabled: false
    tenant_id: ""
    vault_name: ""
    key_name: ""
    resource: "https://vault.azure.net"
    client_id: ""
    client_secret: ""
    environment: "AZUREPUBLICCLOUD"

  # GCP Cloud KMS for auto-unseal
  gcpkms:
    enabled: false
    credentials: ""
    project: ""
    region: ""
    key_ring: ""
    crypto_key: ""

  # Transit seal (seal/unseal using another OpenBao/Vault instance)
  transit:
    enabled: false
    address: ""
    token: ""
    key_name: "autounseal"
    mount_path: "transit/"
    namespace: ""

  # PKCS#11 / HSM seal
  pkcs11:
    enabled: false
    lib: ""
    slot: ""
    pin: ""
    key_label: ""
    hmac_key_label: ""

  # Alternative: provide cloud credentials directly via environment variables
  extraEnvironmentVars: []
  # - name: AWS_ACCESS_KEY_ID
  #   valueFrom:
  #     secretKeyRef:
  #       name: aws-creds
  #       key: access-key
  # - name: AWS_SECRET_ACCESS_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: aws-creds
  #       key: secret-key
