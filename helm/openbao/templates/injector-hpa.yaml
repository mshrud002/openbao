{{- if and .Values.injector.enabled .Values.injector.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "openbao.fullname" . }}-agent-injector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-injector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "openbao.fullname" . }}-agent-injector
  minReplicas: {{ .Values.injector.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.injector.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.injector.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.injector.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.injector.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.injector.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
