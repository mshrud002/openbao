{{- if .Values.grafana.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.grafana.dashboard.name | default (printf "%s-grafana-dashboard" (include "openbao.fullname" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
    {{- with .Values.grafana.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafana.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  openbao-dashboard.json: |
    {
      "title": "OpenBao",
      "uid": "openbao",
      "version": 1,
      "panels": [
        {"type": "stat", "title": "Sealed", "targets": [{"expr": "vault_core_unsealed"}]},
        {"type": "graph", "title": "Requests", "targets": [{"expr": "rate(vault_core_handle_login_count[5m])"}]}
      ]
    }
{{- end }}
