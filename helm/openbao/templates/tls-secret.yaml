{{- $mode := include "openbao.mode" . }}
{{- $tlsEnabled := false }}
{{- if and (eq $mode "standalone") .Values.server.standalone.tls }}
  {{- if .Values.server.standalone.tls.enabled }}{{- $tlsEnabled = true }}{{- end }}
{{- end }}
{{- if and (eq $mode "ha") .Values.server.ha.tls }}
  {{- if .Values.server.ha.tls.enabled }}{{- $tlsEnabled = true }}{{- end }}
{{- end }}
{{- if $tlsEnabled }}
{{- if and (not (and .Values.server.standalone.tls .Values.server.standalone.tls.cert)) (not (and .Values.server.ha.tls .Values.server.ha.tls.cert)) (not (and .Values.server.standalone.tls .Values.server.standalone.tls.existingSecret)) (not (and .Values.server.ha.tls .Values.server.ha.tls.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openbao.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
{{- end }}
{{- end }}
