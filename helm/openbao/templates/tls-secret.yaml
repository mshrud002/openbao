{{- if or (and (eq (include "openbao.mode" .) "standalone") .Values.server.standalone.tls.enabled) (and (eq (include "openbao.mode" .) "ha") .Values.server.ha.tls.enabled) }}
{{- if and (not .Values.server.standalone.tls.cert) (not .Values.server.ha.tls.cert) (not .Values.server.standalone.tls.existingSecret) (not .Values.server.ha.tls.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openbao.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- /* Placeholder - user should provide tls.crt/tls.key via --set-file or existing secret */}}
  tls.crt: ""
  tls.key: ""
{{- end }}
{{- end }}
