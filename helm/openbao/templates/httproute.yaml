{{- if .Values.gateway.enabled }}
{{- range $i, $route := .Values.gateway.routes.http }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "openbao.fullname" $ }}-{{ $i }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "openbao.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      {{- if $.Values.gateway.gatewayClassName }}
      sectionName: {{ $.Values.gateway.gatewayClassName }}
      {{- end }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- with $route.rules }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "openbao.fullname" $ }}
          port: 8200
    {{- end }}
---
{{- end }}
{{- end }}
