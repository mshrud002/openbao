{{- if .Values.injector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openbao.fullname" . }}-agent-injector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-injector
spec:
  replicas: {{ .Values.injector.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "openbao.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent-injector
  template:
    metadata:
      labels:
        {{- include "openbao.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent-injector
      annotations:
        {{- with .Values.server.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "openbao.fullname" . }}-agent-injector
      containers:
        - name: agent-injector
          image: {{ .Values.injector.image.registry }}/{{ .Values.injector.image.repository }}:{{ .Values.injector.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.injector.image.pullPolicy }}
          command:
            - bao-k8s-agent-injector
          args:
            - -address={{ include "openbao.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:8200
            - -tls-skip-verify=true
            - -log-level={{ .Values.injector.logLevel | default .Values.server.logLevel | default "info" }}
            {{- with .Values.injector.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: BAO_ADDR
              value: http://{{ include "openbao.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:8200
            - name: BAO_SKIP_VERIFY
              value: "true"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENT_INJECT_VAULT_AUTH_PATH
              value: {{ .Values.injector.authPath | quote }}
            {{- if .Values.injector.authRole }}
            - name: AGENT_INJECT_VAULT_AUTH_ROLE
              value: {{ .Values.injector.authRole | quote }}
            {{- end }}
            {{- if .Values.injector.agentImage.repository }}
            - name: AGENT_INJECT_AGENT_IMAGE
              value: "{{ .Values.injector.agentImage.registry }}/{{ .Values.injector.agentImage.repository }}:{{ .Values.injector.agentImage.tag | default .Chart.AppVersion }}"
            {{- end }}
            {{- with .Values.injector.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: webhook
              containerPort: 8080
              protocol: TCP
            {{- if .Values.injector.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.injector.metrics.port }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.injector.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openbao.fullname" . }}-agent-injector-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-injector
spec:
  type: ClusterIP
  ports:
    - name: webhook
      port: {{ .Values.injector.service.port | default 443 }}
      targetPort: 8080
      protocol: TCP
  selector:
    {{- include "openbao.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent-injector
{{- end }}

