{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "openbao.fullname" . }}
  namespace: {{ .Values.monitoring.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: openbao.rules
      rules:
        {{- with .Values.monitoring.prometheusRule.rules }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - alert: OpenBaoSealed
          expr: vault_core_unsealed == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: OpenBao is sealed
            description: "{{ $labels.instance }} has been sealed for more than 5 minutes."
        - alert: OpenBaoStandby
          expr: vault_core_active == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OpenBao node is standby
            description: "{{ $labels.instance }} has been standby for more than 10 minutes."
        {{- end }}
{{- end }}
